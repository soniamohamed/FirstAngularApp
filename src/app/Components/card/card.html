 <!-- Card Body -->
            <div class="card-body d-flex flex-column justify-content-between p-3">
              <div>
                <h5 class="card-title text-truncate fw-bold mb-1" [title]="product.title">
                  {{ product.title }}
                </h5>
                <p class="card-text text-muted small mb-3 text-line-clamp-2" style="min-height: 38px;">
                  {{ product.description }}
                </p>
              </div>

              <div>
                <!-- Price and Quantity Section -->
                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                  <span class="fw-bold text-primary fs-5"> {{ product.price }} <small class="fs-6 text-muted">EGP</small></span>
                  <span class="badge bg-light text-dark border">Qty: {{ product.quantity }}</span>
                </div>

                
                  <div class="row g-1 mb-3">
                    @for (imgItem of product.images.slice(0, 4); track $index) {
                      <div class="col-3">
                        <img [src]="imgItem" class="img-fluid rounded border object-fit-cover" style="height: 40px; width: 100%;" [alt]="product.title">
                      </div>
                    }
                  </div>
               
                <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 rounded-2">
                  <i class="fa-solid fa-cart-shopping"></i>
                  <span>Add to Cart</span>
                </button>
              </div>

            </div>
