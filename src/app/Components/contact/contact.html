<section class=" bg-secondary py-5">

  <ul>
      @for (friend of friendsContact; track $index) 
      {
         <li>
        {{friend}}
      </li>
      }
     
    </ul>
  <div class="container py-4">
    
    
    <div class="text-center mb-5">
      <h2 class="fw-bold">تواصل معنا</h2>
      <p class="text-muted">يسعدنا دائماً الاستماع إلى استفساراتكم واقتراحاتكم</p>
    </div>

    <div class="row g-4 justify-content-center">
      
      <!-- Contact Info Sidebar -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm p-4 rounded-4 bg-dark text-white h-100">
          <h4 class="fw-bold mb-4 text-primary">معلومات الاتصال</h4>
          
          <div class="d-flex align-items-center mb-4">
            <i class="fa-solid fa-location-dot fs-4 text-primary me-3"></i>
            <div>
              <h6 class="mb-0 fw-bold">العنوان</h6>
              <small class="text-white-50">مصر، الغربية</small>
            </div>
          </div>

          <div class="d-flex align-items-center mb-4">
            <i class="fa-solid fa-envelope fs-4 text-primary me-3"></i>
            <div>
              <h6 class="mb-0 fw-bold">البريد الإلكتروني</h6>
              <small class="text-white-50">support@mystore.com</small>
            </div>
          </div>

          <div class="d-flex align-items-center">
            <i class="fa-solid fa-phone fs-4 text-primary me-3"></i>
            <div>
              <h6 class="mb-0 fw-bold">الهاتف</h6>
              <small class="text-white-50">+20 100 000 0000</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 rounded-4">
          <form (submit)="$event.preventDefault()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">الاسم</label>
                <input type="text" class="form-control rounded-3" placeholder="أدخل اسمك">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">البريد الإلكتروني</label>
                <input type="email" class="form-control rounded-3" placeholder="name@example.com">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">الموضوع</label>
                <input type="text" class="form-control rounded-3" placeholder="عنوان الرسالة">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">الرسالة</label>
                <textarea class="form-control rounded-3" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2 rounded-3 fw-bold">
                  إرسال الرسالة
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>

  </div>
  <hr/>
        <!-- <app-alert>
      <h3>Hello Alert From Contact </h3>
      <p>Alert Alert! [contact]</p>
      <button> Alert Contact</button>
    </app-alert> -->
    <app-my-btn>
      <!-- <span >Join From Contact</span> -->
       <button class="btn btn-danger">Join</button>
    </app-my-btn>

    

</section>
